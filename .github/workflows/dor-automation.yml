name: DOR Automation Tests
'on':
  push:
    branches:
      - master
      - feature/dor-automation
  pull_request:
    branches:
      - master
  workflow_dispatch: null
jobs:
  automation-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Verify Java Version
        run: java -version
      - name: Run Maven Tests
        run: mvn clean test
      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DOR-Automation-Report
          path: test-output/AutomationReport.html
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DOR-Screenshots
          path: test-output/screenshots/
      - name: Upload Automation Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DOR-Automation-Logs
          path: logs/
